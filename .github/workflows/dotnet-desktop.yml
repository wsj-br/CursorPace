# Builds unsigned release artifacts for Windows, Linux, and macOS.
# A v<Version> tag builds and publishes a GitHub Release only after every
# platform artifact succeeds. workflow_dispatch builds artifacts without
# publishing a release.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: "10.0.111"

jobs:
  test:
    name: Validate and test
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: |
          packages.lock.json
          Tests/packages.lock.json

    - name: Validate release tag and notes
      if: github.event_name == 'push'
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      shell: bash
      run: |
        set -euo pipefail
        version="$(awk -F '[<>]' '/<Version>/{gsub(/[[:space:]]/, "", $3); print $3; exit}' CursorUsageProgress.csproj)"
        if [[ -z "$version" ]]; then
          echo "Could not read <Version> from CursorUsageProgress.csproj." >&2
          exit 1
        fi
        if [[ "$RELEASE_TAG" != "v$version" ]]; then
          echo "Release tag '$RELEASE_TAG' does not match project version '$version'. Expected 'v$version'." >&2
          exit 1
        fi
        test -f "release-notes/RELEASE_NOTES_${version}.md"

    - name: Restore locked dependencies
      run: dotnet restore ./CursorUsageProgress.slnx --locked-mode

    - name: Test
      run: dotnet test ./Tests/CursorUsageProgress.Tests.csproj -c Release --no-restore

  build-windows:
    name: Build Windows x64
    runs-on: windows-2025
    needs: test
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: |
          packages.lock.json
          Tests/packages.lock.json

    - name: Publish and compile installer
      run: .\scripts\build.ps1 -SkipTests

    - name: Upload Windows installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: installer-windows
        path: |
          installer/*-win-x64-setup.exe
          installer/*-win-x64-setup.exe.sha256
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  build-linux:
    name: Build Linux ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    needs: test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: |
          packages.lock.json
          Tests/packages.lock.json

    - name: Install AppImage build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          file imagemagick libgtk-3-0 libwebkit2gtk-4.1-0 libsoup-3.0-0

    - name: Publish and build AppImage
      run: ./scripts/build.sh --skip-tests --rid "${{ matrix.rid }}"

    - name: Upload Linux AppImage artifact
      uses: actions/upload-artifact@v7
      with:
        name: installer-linux-${{ matrix.rid }}
        path: |
          installer/*-${{ matrix.rid }}.AppImage
          installer/*-${{ matrix.rid }}.AppImage.sha256
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  build-macos:
    name: Build macOS ${{ matrix.rid }}
    runs-on: macos-15
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-arm64
          - osx-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        cache: true
        cache-dependency-path: |
          packages.lock.json
          Tests/packages.lock.json

    - name: Publish and build app bundle
      run: ./scripts/build.sh --skip-tests --rid "${{ matrix.rid }}"

    - name: Upload macOS app bundle artifact
      uses: actions/upload-artifact@v7
      with:
        name: installer-macos-${{ matrix.rid }}
        path: |
          installer/*-${{ matrix.rid }}.zip
          installer/*-${{ matrix.rid }}.zip.sha256
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.event.deleted == false
    runs-on: ubuntu-24.04
    needs:
      - build-windows
      - build-linux
      - build-macos
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download platform artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: installer-*
        path: installer
        merge-multiple: true

    - name: Verify release artifacts
      id: release
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      shell: bash
      run: |
        set -euo pipefail
        version="${RELEASE_TAG#v}"
        expected=(
          "CursorUsageProgress-${version}-win-x64-setup.exe"
          "CursorUsageProgress-${version}-win-x64-setup.exe.sha256"
          "CursorUsageProgress-${version}-linux-x64.AppImage"
          "CursorUsageProgress-${version}-linux-x64.AppImage.sha256"
          "CursorUsageProgress-${version}-linux-arm64.AppImage"
          "CursorUsageProgress-${version}-linux-arm64.AppImage.sha256"
          "CursorUsageProgress-${version}-osx-arm64.zip"
          "CursorUsageProgress-${version}-osx-arm64.zip.sha256"
          "CursorUsageProgress-${version}-osx-x64.zip"
          "CursorUsageProgress-${version}-osx-x64.zip.sha256"
        )
        for asset in "${expected[@]}"; do
          test -f "installer/$asset"
        done
        (
          cd installer
          sha256sum --check --strict -- *.sha256
        )
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Create release with verified assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
        VERSION: ${{ steps.release.outputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        assets=(
          "installer/CursorUsageProgress-${VERSION}-win-x64-setup.exe"
          "installer/CursorUsageProgress-${VERSION}-win-x64-setup.exe.sha256"
          "installer/CursorUsageProgress-${VERSION}-linux-x64.AppImage"
          "installer/CursorUsageProgress-${VERSION}-linux-x64.AppImage.sha256"
          "installer/CursorUsageProgress-${VERSION}-linux-arm64.AppImage"
          "installer/CursorUsageProgress-${VERSION}-linux-arm64.AppImage.sha256"
          "installer/CursorUsageProgress-${VERSION}-osx-arm64.zip"
          "installer/CursorUsageProgress-${VERSION}-osx-arm64.zip.sha256"
          "installer/CursorUsageProgress-${VERSION}-osx-x64.zip"
          "installer/CursorUsageProgress-${VERSION}-osx-x64.zip.sha256"
        )
        existing_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
        if [[ "$existing_draft" == "true" ]]; then
          gh release delete "$RELEASE_TAG" --yes
        elif [[ "$existing_draft" == "false" ]]; then
          echo "Release '$RELEASE_TAG' is already published. Refusing to replace it." >&2
          exit 1
        fi
        gh release create "$RELEASE_TAG" "${assets[@]}" \
          --verify-tag \
          --title "$RELEASE_TAG" \
          --notes-file "release-notes/RELEASE_NOTES_${VERSION}.md"
