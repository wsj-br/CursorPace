# Builds the Inno Setup installer and attaches it to a GitHub Release.
# Publish a release (tag v1.0.0 matching <Version> in CursorUsageProgress.csproj).
# workflow_dispatch builds the same installer without attaching it to a release.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "10.0.x"

    - name: Check release tag matches project version
      if: github.event_name == 'release'
      shell: pwsh
      run: |
        $csproj = Get-Content -LiteralPath CursorUsageProgress.csproj -Raw
        if ($csproj -notmatch '<Version>([^<]+)</Version>') {
          throw 'Could not find <Version> in CursorUsageProgress.csproj'
        }
        $version = $Matches[1].Trim()
        $tag = '${{ github.event.release.tag_name }}'
        if ($tag -ne "v$version" -and $tag -ne $version) {
          throw "Release tag '$tag' does not match csproj Version '$version'. Use tag v$version."
        }

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Test, publish, and compile installer
      run: .\scripts\build.ps1

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer
        path: |
          installer/*.exe
          installer/*.sha256
        if-no-files-found: error

    - name: Attach installer to GitHub Release
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        gh release upload "${{ github.event.release.tag_name }}"
        installer/CursorUsageProgress-*-win-x64-setup.exe
        installer/CursorUsageProgress-*-win-x64-setup.exe.sha256
        --clobber
